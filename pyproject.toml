[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcrec"
version = "0.1.0"
description = "Ricostruzione di una TC toracica da due radiografie ortogonali con deep learning e vincolo di riproiezione"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = ["pydicom>=2.4", "SimpleITK>=2.3", "pandas>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
